<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Petals and Posies flower shop miniature">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f2e9"/>
      <stop offset="1" stop-color="#ece4d3"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ecdd"/>
      <stop offset="1" stop-color="#e7ddc8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#357063"/>
      <stop offset="1" stop-color="#255249"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b79b"/>
      <stop offset="1" stop-color="#b39a78"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe7e0"/>
      <stop offset="0.5" stop-color="#c3d0c6"/>
      <stop offset="1" stop-color="#d8e0d6"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#4a3f2a" stop-opacity="0.10"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3a2f1e" flood-opacity="0.16"/>
    </filter>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3a2f1e" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect x="70" y="70" width="660" height="620" rx="10" fill="url(#wall)"/>
  <!-- soft brick hint -->
  <g opacity="0.10" fill="#8a5a34">
    <rect x="96" y="150" width="60" height="16" rx="3"/>
    <rect x="170" y="150" width="60" height="16" rx="3"/>
    <rect x="600" y="150" width="60" height="16" rx="3"/>
    <rect x="640" y="200" width="60" height="16" rx="3"/>
    <rect x="110" y="205" width="60" height="16" rx="3"/>
  </g>

  <!-- signboard -->
  <g filter="url(#soft)">
    <rect x="120" y="96" width="560" height="86" rx="12" fill="url(#teal)"/>
    <rect x="132" y="108" width="536" height="62" rx="8" fill="none" stroke="#e9dfc6" stroke-width="2" opacity="0.6"/>
  </g>
  <text x="400" y="153" text-anchor="middle" font-family="'Palatino Linotype',Palatino,Georgia,serif" font-style="italic" font-size="42" fill="#f4ecd9">petals &amp; posies</text>

  <!-- awning -->
  <g filter="url(#soft)">
    <path d="M118 196 h564 v20 a14 14 0 0 1 -14 14 H132 a14 14 0 0 1 -14 -14 Z" fill="#2f6e60"/>
    <path d="M126 216
      q26 34 52 0 q26 34 52 0 q26 34 52 0 q26 34 52 0 q26 34 52 0
      q26 34 52 0 q26 34 52 0 q26 34 52 0 q26 34 52 0 q26 34 52 0
      l0 -0 q13 17 26 8 l0 -8 Z" fill="#f2ead9"/>
    <g fill="#d6493b">
      <path d="M126 216 q26 34 52 0 l0 -0 h-52 Z"/>
      <path d="M230 216 q26 34 52 0 h-52 Z"/>
      <path d="M334 216 q26 34 52 0 h-52 Z"/>
      <path d="M438 216 q26 34 52 0 h-52 Z"/>
      <path d="M542 216 q26 34 52 0 h-52 Z"/>
      <path d="M646 216 q22 30 44 4 l0 -4 h-44 Z"/>
    </g>
  </g>

  <!-- storefront: window (left) and door (right) -->
  <g filter="url(#soft2)">
    <rect x="120" y="250" width="300" height="330" rx="10" fill="#2f6e60"/>
    <rect x="138" y="268" width="264" height="294" rx="6" fill="url(#glass)"/>
    <line x1="270" y1="268" x2="270" y2="562" stroke="#2f6e60" stroke-width="8"/>
    <line x1="138" y1="415" x2="402" y2="415" stroke="#2f6e60" stroke-width="8"/>
    <!-- bouquets behind glass -->
    <g opacity="0.85">
      <circle cx="200" cy="360" r="14" fill="#e79b86"/><circle cx="222" cy="352" r="12" fill="#e9c877"/>
      <circle cx="182" cy="352" r="11" fill="#c98fbf"/><rect x="196" y="368" width="6" height="34" fill="#6e8c67"/>
      <circle cx="330" cy="356" r="14" fill="#d9695a"/><circle cx="350" cy="366" r="11" fill="#f1e7d6"/>
      <circle cx="312" cy="366" r="11" fill="#b9a6d0"/><rect x="326" y="368" width="6" height="34" fill="#6e8c67"/>
    </g>
  </g>

  <g filter="url(#soft2)">
    <rect x="450" y="250" width="230" height="330" rx="10" fill="#2f6e60"/>
    <path d="M470 320 a95 95 0 0 1 190 0 v240 a8 8 0 0 1 -8 8 H478 a8 8 0 0 1 -8 -8 Z" fill="#347063"/>
    <path d="M486 322 a79 79 0 0 1 158 0 v70 H486 Z" fill="url(#glass)"/>
    <rect x="486" y="404" width="158" height="160" rx="4" fill="#2b6155"/>
    <rect x="500" y="418" width="130" height="70" rx="3" fill="#3b7a6c"/>
    <circle cx="628" cy="470" r="6" fill="#c7a24b"/>
  </g>

  <!-- floor -->
  <rect x="70" y="600" width="660" height="90" rx="8" fill="url(#floor)"/>
  <g stroke="#a68a66" stroke-width="2" opacity="0.5">
    <line x1="70" y1="628" x2="730" y2="628"/>
    <line x1="70" y1="660" x2="730" y2="660"/>
    <line x1="200" y1="600" x2="200" y2="690"/>
    <line x1="340" y1="600" x2="340" y2="690"/>
    <line x1="480" y1="600" x2="480" y2="690"/>
    <line x1="600" y1="600" x2="600" y2="690"/>
  </g>

  <!-- foreground: flower buckets -->
  <!-- bucket 1 -->
  <g filter="url(#soft)">
    <path d="M120 560 h70 l-8 66 h-54 Z" fill="#c7a24b"/>
    <ellipse cx="155" cy="560" rx="35" ry="9" fill="#d8b45a"/>
    <g>
      <circle cx="132" cy="522" r="15" fill="#e79b86"/><circle cx="158" cy="510" r="16" fill="#d9695a"/>
      <circle cx="180" cy="524" r="14" fill="#e9c877"/><circle cx="146" cy="500" r="13" fill="#f1e7d6"/>
      <circle cx="170" cy="500" r="12" fill="#c98fbf"/>
      <path d="M140 556 q-6 -34 -8 -46" stroke="#6e8c67" stroke-width="5" fill="none"/>
      <path d="M162 556 q4 -40 0 -54" stroke="#6e8c67" stroke-width="5" fill="none"/>
      <path d="M176 556 q6 -30 6 -40" stroke="#6e8c67" stroke-width="5" fill="none"/>
    </g>
  </g>

  <!-- bucket 2 -->
  <g filter="url(#soft)">
    <path d="M214 566 h64 l-7 60 h-50 Z" fill="#b9895a"/>
    <ellipse cx="246" cy="566" rx="32" ry="8" fill="#c99a68"/>
    <g>
      <circle cx="226" cy="532" r="14" fill="#b9a6d0"/><circle cx="250" cy="522" r="15" fill="#e79b86"/>
      <circle cx="270" cy="534" r="13" fill="#e9c877"/><circle cx="240" cy="514" r="12" fill="#f1e7d6"/>
      <path d="M232 562 q-4 -30 -6 -40" stroke="#55704f" stroke-width="5" fill="none"/>
      <path d="M252 562 q2 -34 0 -46" stroke="#55704f" stroke-width="5" fill="none"/>
    </g>
  </g>

  <!-- A-frame chalkboard -->
  <g filter="url(#soft)">
    <path d="M628 690 l24 -120 h10 l24 120 Z" fill="#5a3e28"/>
    <rect x="636" y="576" width="52" height="70" rx="4" fill="#243026"/>
    <text x="662" y="600" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="13" fill="#e9dfc6">Fresh</text>
    <text x="662" y="618" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="13" fill="#e9dfc6">Flowers</text>
    <text x="662" y="636" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="11" fill="#c7a24b">daily</text>
  </g>

  <!-- potted plant right -->
  <g filter="url(#soft)">
    <path d="M556 632 h44 l-6 44 h-32 Z" fill="#c98a6b"/>
    <g fill="#6e8c67">
      <path d="M578 632 q-20 -40 -30 -58 q22 8 34 40 Z"/>
      <path d="M578 632 q20 -44 32 -60 q-20 10 -30 44 Z"/>
      <path d="M578 632 q0 -50 0 -70 q10 20 6 56 Z"/>
    </g>
  </g>

  <!-- hanging plant -->
  <g filter="url(#soft2)">
    <line x1="470" y1="230" x2="470" y2="256" stroke="#8a5a34" stroke-width="3"/>
    <path d="M448 256 h44 l-6 22 h-32 Z" fill="#b07b4f"/>
    <g fill="#7fa07c">
      <path d="M452 276 q-6 34 -14 52 q-4 -30 4 -52 Z"/>
      <path d="M470 276 q0 40 -2 58 q-8 -30 -6 -58 Z"/>
      <path d="M486 276 q8 34 16 50 q2 -30 -6 -50 Z"/>
    </g>
  </g>

  <rect width="800" height="800" fill="url(#vignette)"/>
</svg>
