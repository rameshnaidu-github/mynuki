<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 545" width="616" height="545" role="img" aria-label="Dabble and Dahlia">
  <title>Dabble and Dahlia</title>
  <!-- isometric heart-room: two corners meeting, walls above a crimson floor -->
  <g>
    <!-- left outer wall -->
    <path d="M5 146 L163 40 L163 235 L5 323 Z" fill="#f9a8c1"/>
    <!-- left inner wall -->
    <path d="M163 40 L310 146 L310 323 L163 235 Z" fill="#fb4c7c"/>
    <!-- right inner wall -->
    <path d="M310 146 L468 40 L468 235 L310 323 Z" fill="#f9a8c1"/>
    <!-- right outer wall -->
    <path d="M468 40 L611 146 L611 323 L468 235 Z" fill="#fb4c7c"/>
    <!-- floor -->
    <path d="M5 323 L163 235 L310 323 L468 235 L611 323 L310 535 Z" fill="#c81450"/>
    <!-- faint seam where the two floors meet -->
    <path d="M310 323 L206 386" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- arched doorway on the right wall -->
  <g transform="translate(487 158)">
    <path d="M8 46 A46 46 0 0 1 100 46 L100 118 L8 132 Z" fill="#111111"/>
    <path d="M8 46 A46 46 0 0 1 100 46 L100 118 L8 132 Z" fill="none" stroke="#111111" stroke-width="7" stroke-linejoin="round"/>
    <g stroke="#f3f3f3" stroke-width="3" stroke-linecap="round" opacity="0.95">
      <path d="M62 22 L62 122"/>
      <path d="M72 20 L72 124"/>
      <path d="M82 24 L82 124"/>
      <path d="M92 32 L92 122"/>
    </g>
  </g>
</svg>
